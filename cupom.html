<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupom de Impressão</title>
    <style>
        /* Reset geral */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            color: #000;
            background: #fff;
            font-size: 24px; 
            font-weight: normal; 
            padding: 5px;
        }
        
        .header {
            text-align: center;
            border-bottom: 2px dashed #000;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        
        .header h2 { margin: 0; font-size: 32px; font-weight: normal; } 
        .header p { margin: 5px 0 0 0; font-size: 22px; }
        
        .info { margin-bottom: 20px; }
        .info p { margin: 8px 0; }
        
        #txt-itens { 
            white-space: pre-wrap; 
            display: block; 
            margin-top: 10px; 
            line-height: 1.4; 
            font-weight: normal; 
        }
        
        .total {
            border-top: 2px dashed #000;
            padding-top: 15px;
            margin-top: 15px;
            text-align: right;
            font-weight: normal;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            border-top: 2px dashed #000;
            padding-top: 15px;
            font-weight: normal;
        }

        /* A MÁGICA ACONTECE AQUI: Regras estritas SÓ para a impressora */
        @media print {
            @page { 
                margin: 0; 
            } 
            body { 
                margin: 0; 
                padding: 5px;
                width: 100%; 
                max-width: 100%;
                /* Forçando o tamanho em "pontos" na hora de imprimir */
                font-size: 20pt !important; 
            }
            .header h2 { font-size: 28pt !important; }
            .header p { font-size: 18pt !important; }
            .info { font-size: 20pt !important; }
            #txt-itens { font-size: 24pt !important; line-height: 1.5 !important; }
            .total { font-size: 26pt !important; }
            .footer { font-size: 16pt !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>PEDIDO</h2>
        <p>Recibo de Conferência</p>
    </div>

    <div class="info">
        <p>Cliente: <span id="txt-cliente"></span></p>
        <p>Itens: <span id="txt-itens"></span></p>
    </div>

    <div class="total">
        TOTAL: R$ <span id="txt-total"></span>
    </div>

    <div class="footer">
        Obrigado pela preferência!
    </div>

    <script>
        const parametrosDaURL = new URLSearchParams(window.location.search);

        const cliente = parametrosDaURL.get('cliente');
        const itens = parametrosDaURL.get('itens');
        const total = parametrosDaURL.get('total');

        document.getElementById('txt-cliente').innerText = cliente || 'Não informado';
        document.getElementById('txt-itens').innerText = itens || 'Sem itens';
        document.getElementById('txt-total').innerText = total || '0,00';

        window.onload = function() {
            setTimeout(() => {
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
