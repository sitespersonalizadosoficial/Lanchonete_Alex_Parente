<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupom de Impressão</title>
    <style>
        /* Reset geral */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            color: #000;
            background: #fff;
            font-size: 18px; /* Letra maior no geral */
            padding: 5px;
        }
        .header {
            text-align: center;
            border-bottom: 2px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header h2 { margin: 0; font-size: 26px; font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 16px; font-weight: bold; }
        
        .info { margin-bottom: 15px; font-size: 18px; }
        .info p { margin: 5px 0; }
        
        #txt-itens { 
            white-space: pre-wrap; 
            display: block; 
            margin-top: 8px; 
            font-size: 20px; /* Itens maiores e em negrito para facilitar a leitura na cozinha */
            font-weight: bold; 
        }
        
        .total {
            font-size: 24px; /* Total bem destacado */
            font-weight: bold;
            border-top: 2px dashed #000;
            padding-top: 10px;
            text-align: right;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            border-top: 2px dashed #000;
            padding-top: 10px;
            font-weight: bold;
        }

        /* Regras estritas SÓ para a hora que a impressora puxar */
        @media print {
            @page { 
                margin: 0; 
            } 
            body { 
                margin: 0; 
                padding: 0;
                width: 100%; 
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>PEDIDO</h2>
        <p>Recibo de Conferência</p>
    </div>

    <div class="info">
        <p><strong>Cliente:</strong> <span id="txt-cliente"></span></p>
        <p><strong>Itens:</strong> <span id="txt-itens"></span></p>
    </div>

    <div class="total">
        TOTAL: R$ <span id="txt-total"></span>
    </div>

    <div class="footer">
        Obrigado pela preferência!
    </div>

    <script>
        const parametrosDaURL = new URLSearchParams(window.location.search);

        const cliente = parametrosDaURL.get('cliente');
        const itens = parametrosDaURL.get('itens');
        const total = parametrosDaURL.get('total');

        document.getElementById('txt-cliente').innerText = cliente || 'Não informado';
        document.getElementById('txt-itens').innerText = itens || 'Sem itens';
        document.getElementById('txt-total').innerText = total || '0,00';

        window.onload = function() {
            setTimeout(() => {
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
