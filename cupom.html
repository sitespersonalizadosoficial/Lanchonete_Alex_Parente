<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupom de Impressão</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            width: 300px; 
            margin: 0 auto;
            color: #000;
            background: #fff;
            font-size: 14px;
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header h2 { margin: 0; font-size: 18px; }
        .header p { margin: 5px 0 0 0; font-size: 12px; }
        .info { margin-bottom: 15px; }
        .info p { margin: 5px 0; }
        
        #txt-itens { 
            white-space: pre-wrap; 
            display: block; 
            margin-top: 5px; 
        }
        
        .total {
            font-size: 16px;
            font-weight: bold;
            border-top: 1px dashed #000;
            padding-top: 10px;
            text-align: right;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            border-top: 1px dashed #000;
            padding-top: 10px;
        }

        @media print {
            @page { margin: 0; } 
            body { margin: 0.5cm; width: auto; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>PEDIDO</h2>
        <p>Recibo de Conferência</p>
    </div>

    <div class="info">
        <p><strong>Cliente:</strong> <span id="txt-cliente"></span></p>
        <p><strong>Itens:</strong> <span id="txt-itens"></span></p>
    </div>

    <div class="total">
        TOTAL: R$ <span id="txt-total"></span>
    </div>

    <div class="footer">
        Obrigado pela preferência!
    </div>

    <script>
        const parametrosDaURL = new URLSearchParams(window.location.search);

        const cliente = parametrosDaURL.get('cliente');
        const itens = parametrosDaURL.get('itens');
        const total = parametrosDaURL.get('total');

        document.getElementById('txt-cliente').innerText = cliente || 'Não informado';
        document.getElementById('txt-itens').innerText = itens || 'Sem itens';
        document.getElementById('txt-total').innerText = total || '0,00';

        window.onload = function() {
            setTimeout(() => {
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
